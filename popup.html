<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <button id="copyBtn" class="primary-btn">
      <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span>Copy Transcript</span>
    </button>

    <div class="option-row">
      <span class="option-label" id="timestampLabel">Include timestamps</span>
      <label class="toggle" role="switch" aria-checked="false" aria-labelledby="timestampLabel">
        <input type="checkbox" id="timestampToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div id="status" class="status" aria-live="polite"></div>

    <div class="settings-section">
      <div class="setting-row">
        <span class="setting-label">Keyboard shortcut</span>
        <kbd id="shortcutDisplay" class="shortcut-key">Alt+Shift+C</kbd>
      </div>
      <button id="changeShortcut" class="link-btn">
        Customize in Chrome Settings →
      </button>
    </div>

    <footer>v1.0.0</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
